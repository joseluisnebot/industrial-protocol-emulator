# © mifsut.com — industrial-protocol-emulator
# One container: all protocols + embedded Mosquitto broker.
services:
  emulator:
    build: .
    image: ghcr.io/joseluisnebot/industrial-protocol-emulator:latest
    restart: unless-stopped
    ports:
      - "8080:8080"          # web panel
      - "502:502"            # Modbus TCP
      - "4840:4840"          # OPC-UA
      - "1883:1883"          # MQTT
      - "20000:20000"        # DNP3 (stub)
      - "44818:44818"        # EtherNet/IP
      - "47808:47808/udp"    # BACnet/IP
      - "161:161/udp"        # SNMP
    environment:
      - PYTHONUNBUFFERED=1
